# Project-wide Gradle settings.
#
# NOTE: settings configured through the Android Studio UI override this file,
# so keep build-affecting configuration here (and in version control) rather
# than in IDE preferences.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon. The JDK *version* used by the daemon is
# pinned separately in gradle/gradle-daemon-jvm.properties.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required by AGP 8.x when depending on AndroidX artifacts.
android.useAndroidX=true

# Each module gets its own R class instead of one containing every dependency's
# resources. Required by AGP 8.x defaults and keeps builds incremental.
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
